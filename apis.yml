aid: ocean-security
name: Ocean Security
description: >-
  Ocean Security (Ocean) is an AI-native, agentic email security platform that stops targeted,
  AI-powered email attacks that surface-level detection tools miss. At its core is Ray, an
  autonomous investigation engine that reviews every inbound email in real time — checking the
  sender, content, links, technical infrastructure, and business context to decide whether a
  message can be trusted — enabling enterprises to stop phishing, business email compromise (BEC),
  impersonation, and financial fraud. The platform pairs deep email investigation with autonomous
  SOC triage and real-time employee inbox guidance. Ocean's REST API gives security teams
  programmatic access to detected threats, phishing reports (SONAR), allow/deny list settings, and
  ROI/security metrics such as hours saved and financial loss prevented. Founded in Israel and
  backed by Lightspeed Venture Partners, Ocean protects hundreds of thousands of mailboxes across
  Global Fortune 500 organizations.
